<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過去の地震情報マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>過去の地震情報マップ</h1>
    <p class="subtitle">USGS地震カタログをもとに、指定した期間・地域・マグニチュードの地震を地図上に表示します</p>
  </header>

  <div class="app-body">
    <aside class="panel">
      <form id="search-form" class="search-form">
        <div class="field">
          <label for="region">地域</label>
          <select id="region">
            <option value="japan" selected>日本周辺</option>
            <option value="world">世界全体</option>
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="start-date">開始日</label>
            <input type="date" id="start-date">
          </div>
          <div class="field">
            <label for="end-date">終了日</label>
            <input type="date" id="end-date">
          </div>
        </div>

        <div class="field">
          <label for="min-mag">最小マグニチュード: <span id="min-mag-value">3.0</span></label>
          <input type="range" id="min-mag" min="0" max="8" step="0.5" value="3.0">
        </div>

        <button type="submit" id="search-btn">検索</button>
        <p id="status" class="status"></p>
      </form>

      <div class="legend">
        <h2>マグニチュード</h2>
        <ul>
          <li><span class="dot" style="background:#4caf50"></span>〜3.0未満</li>
          <li><span class="dot" style="background:#ffeb3b"></span>3.0〜4.0未満</li>
          <li><span class="dot" style="background:#ff9800"></span>4.0〜5.0未満</li>
          <li><span class="dot" style="background:#f44336"></span>5.0〜6.0未満</li>
          <li><span class="dot" style="background:#7b1fa2"></span>6.0以上</li>
        </ul>
      </div>

      <div class="list-wrapper">
        <h2>検索結果 (<span id="result-count">0</span>件)</h2>
        <ul id="quake-list" class="quake-list"></ul>
      </div>
    </aside>

    <main class="map-wrapper">
      <div id="map"></div>
    </main>
  </div>

  <footer class="app-footer">
    <p>データ提供: <a href="https://earthquake.usgs.gov/" target="_blank" rel="noopener">USGS Earthquake Hazards Program</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
