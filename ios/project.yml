name: CrackDetector
options:
  bundleIdPrefix: com.example.crackdetector
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CrackDetector:
    type: application
    platform: iOS
    sources:
      - path: CrackDetector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.crackdetector
        PRODUCT_NAME: CrackDetector
        INFOPLIST_KEY_CFBundleDisplayName: ひび割れ検出
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: ひび割れを撮影して検出するためにカメラを使用します。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CrackDetectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrackDetectorTests
    dependencies:
      - target: CrackDetector
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.crackdetector.tests
schemes:
  CrackDetector:
    build:
      targets:
        CrackDetector: all
        CrackDetectorTests: [test]
    test:
      targets:
        - CrackDetectorTests
